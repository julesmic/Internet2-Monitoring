version: '3.8'

services:
  # --- The "Internet2" Sites (Data Transfer Nodes) ---
  site-a-dtn:
    image: networkstatic/iperf3
    command: -s
    ports:
      - "5201:5201"
    networks:
      - internet2

  site-b-dtn:
    image: networkstatic/iperf3
    command: -s
    networks:
      - internet2

  # --- Network Performance Exporter (Blackbox) ---
  blackbox-exporter:
    image: prom/blackbox-exporter
    ports:
      - "9115:9115"
    networks:
      - internet2

  # --- The "NOC" (Monitoring Stack) ---
  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - internet2

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - internet2

networks:
  internet2:
    driver: bridge
EOF
